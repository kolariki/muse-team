<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Tably Team · app icon. A white squircle with the TT monogram: two T's side by side, the first black, the second in the
       brand violet, overlapping like two seats at the same table (a T is also a table seen from the side: top + leg). -->
  <defs>
    <linearGradient id="t2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8366F2"/>
      <stop offset="1" stop-color="#5B3BE0"/>
    </linearGradient>
  </defs>
  <path d="M256 12C60 12 12 60 12 256s48 244 244 244 244-48 244-244S452 12 256 12z" fill="#FFFFFF" stroke="#E4E4EE" stroke-width="6"/>
  <!-- second T (team), behind, violet -->
  <path d="M232 128h190c10 0 18 8 18 18v26c0 10-8 18-18 18h-60v170c0 10-8 18-18 18h-34c-10 0-18-8-18-18V190h-60c-10 0-18-8-18-18v-26c0-10 8-18 18-18z" fill="url(#t2)"/>
  <!-- first T (tably), in front, black -->
  <path d="M90 128h190c10 0 18 8 18 18v26c0 10-8 18-18 18h-60v170c0 10-8 18-18 18h-34c-10 0-18-8-18-18V190H90c-10 0-18-8-18-18v-26c0-10 8-18 18-18z" fill="#14141C"/>
</svg>
